{% extends 'base.html' %}

{% block content %}

<div class="row">

    <!--Left sidebar-->
    <!--Load the sidebar here-->

    {% include 'dashboard/sidebar.html' %}

    <!--Right side content-->
    <div class="col-md-9">
        <p>Logged in as <b>{{ user }}</b> </p>
        <div class="row">
            <div class="col">
                <div class="card border-default mb-3">
                    <div class="card-header text-center text-uppercase font-weight-bold">All Categories</div>
                    <div class="class-body">
                        <h5 class="card-tiltle text-center">{{ category_count }}</h5>
                    </div>
                </div>
            </div>
            <div class="col">
            <div class="card border-default mb-3">
                <div class="card-header text-center text-uppercase font-weight-bold">All Posts</div>
                    <div class="class-body">
                        <h5 class="card-tiltle text-center">{{ blogs_count }}</h5>
                    </div>
                </div>
            </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
