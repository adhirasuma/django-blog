{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}
<div class="row">
    <!--Left sidebar-->
    <!--Load the sidebar here-->
    {% include 'dashboard/sidebar.html' %}

    <!--Right side content-->
    <div class="col-md-9">
    {% if perms.auth.view_user %}
    <h3>Edit User</h3>
    <form action="{% url 'edit_user' user.id %}" method="POST" enctype="multipart/form-data" style="width: 500px;">
        {% csrf_token %}
        {{ form | crispy }}
        <button type="submit" class="btn btn-warning">Submit</button>
    </form>
    {% else %}
    <h5>You do not have permission to view this page</h5>
    {% endif %}
    <br>
    </div>
</div>
{% endblock %}
